<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Foodie — Data to Insight to Action</title>
  <desc id="desc">A dark blue data-inspired banner with a connected path from data to insight to action.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426" />
      <stop offset="0.52" stop-color="#0B2340" />
      <stop offset="1" stop-color="#103D4B" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D6C7" />
      <stop offset="0.58" stop-color="#55A9FF" />
      <stop offset="1" stop-color="#FFB45B" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#BFD8F2" stroke-opacity="0.075" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#background)" />
  <rect width="1200" height="300" rx="28" fill="url(#grid)" />

  <circle cx="1050" cy="16" r="178" fill="#26D2C1" opacity="0.055" />
  <circle cx="1125" cy="265" r="126" fill="#FFB45B" opacity="0.055" />

  <g opacity="0.9">
    <path d="M805 215 C842 192 853 124 900 145 C944 166 963 82 1017 103 C1060 117 1093 72 1145 65"
          fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" />
    <path d="M805 215 L805 240 L1145 240" fill="none" stroke="#C6DBEE" stroke-opacity="0.16" stroke-width="1.5" />
    <g fill="#0B2340" stroke-width="4" filter="url(#glow)">
      <circle cx="805" cy="215" r="9" stroke="#34D6C7" />
      <circle cx="900" cy="145" r="9" stroke="#48C3E0" />
      <circle cx="1017" cy="103" r="9" stroke="#6CA2FF" />
      <circle cx="1145" cy="65" r="9" stroke="#FFB45B" />
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="84" fill="#88A7C2" font-size="17" font-weight="700" letter-spacing="4">FOODIE · DATA ANALYST &amp; BUILDER</text>
    <text x="68" y="158" fill="#F4FAFF" font-size="44" font-weight="750" letter-spacing="-0.5">DATA → INSIGHT → ACTION</text>
    <rect x="72" y="184" width="570" height="4" rx="2" fill="url(#accent)" />
    <text x="72" y="230" fill="#C9DBEA" font-size="21" font-weight="450">AI-assisted analytics · visualization · decision systems</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
    <text x="788" y="267" fill="#66E2D7">DATA</text>
    <text x="872" y="267" fill="#7BC7EA">EVIDENCE</text>
    <text x="1000" y="267" fill="#91B6FF">INSIGHT</text>
    <text x="1110" y="267" fill="#FFC477">ACTION</text>
  </g>
</svg>
