<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Foodie — Data to Insight to Action</title>
  <desc id="desc">A dark blue data-inspired banner with a connected path from data to insight to action.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426" />
      <stop offset="0.52" stop-color="#0B2340" />
      <stop offset="1" stop-color="#103D4B" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D6C7" />
      <stop offset="0.58" stop-color="#55A9FF" />
      <stop offset="1" stop-color="#FFB45B" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#BFD8F2" stroke-opacity="0.075" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#background)" />
  <rect width="1200" height="300" rx="28" fill="url(#grid)" />

  <circle cx="1050" cy="16" r="178" fill="#26D2C1" opacity="0.055" />
  <circle cx="1125" cy="265" r="126" fill="#FFB45B" opacity="0.055" />

  <g opacity="0.9">
    <path d="M810 212 C872 198 895 136 965 132 C1035 128 1062 82 1120 70"
          fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" />
    <path d="M810 212 L810 240 L1120 240" fill="none" stroke="#C6DBEE" stroke-opacity="0.16" stroke-width="1.5" />
    <g fill="#0B2340" stroke-width="4" filter="url(#glow)">
      <circle cx="810" cy="212" r="10" stroke="#34D6C7" />
      <circle cx="965" cy="132" r="10" stroke="#6CA2FF" />
      <circle cx="1120" cy="70" r="10" stroke="#FFB45B" />
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="84" fill="#A9C4DB" font-size="22" font-weight="700" letter-spacing="3.5">FOODIE · DATA ANALYST &amp; BUILDER</text>
    <text x="68" y="158" fill="#F4FAFF" font-size="44" font-weight="750" letter-spacing="-0.5">DATA → INSIGHT → ACTION</text>
    <rect x="72" y="184" width="570" height="4" rx="2" fill="url(#accent)" />
    <text x="72" y="232" fill="#D6E5F1" font-size="24" font-weight="500">AI-assisted analytics · visualization · decision systems</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="750" letter-spacing="1.5" text-anchor="middle">
    <text x="810" y="272" fill="#66E2D7">DATA</text>
    <text x="965" y="272" fill="#91B6FF">INSIGHT</text>
    <text x="1120" y="272" fill="#FFC477">ACTION</text>
  </g>
</svg>
